[package]
name = "cordis"
description = "Components with revertible effects and reactive dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cordis-macros = { path = "../cordis-macros", version = "0.1.0" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
slotmap = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "macros"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
